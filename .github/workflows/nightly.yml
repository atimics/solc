name: Nightly verification

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Deterministic core coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enforce line coverage floor
        run: python3 scripts/check-coverage.py --minimum-lines 77

  gcc-analyzer:
    name: GCC interprocedural analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@v4
      - name: Analyze deterministic core
        run: |
          cmake -S . -B build-analyze -G Ninja \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSOLC_ENABLE_GCC_ANALYZER=ON
          cmake --build build-analyze --parallel

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CC: clang
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-thread -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSOLC_ENABLE_THREAD_SANITIZER=ON
      - name: Build
        run: cmake --build build-thread --parallel
      - name: Test concurrent execution
        run: ctest --test-dir build-thread --output-on-failure --parallel 2

  extended-fuzz:
    name: Extended fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
      - name: Fuzz all deterministic byte boundaries
        run: scripts/run-fuzz.sh 300 build-fuzz
