[package]
name = "solc-orchestrator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "solc-wire"
path = "src/main.rs"

[[bin]]
name = "solc-bridge"
path = "src/bridge.rs"

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.146"
