[package]
name = "solc-upstream-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
solana-message = { git = "https://github.com/anza-xyz/solana-sdk.git", rev = "5ec913f7826c3c7ccbfc8adacc69605e90b3d6fa" }
